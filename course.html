<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكورس | الدكتور في العلوم</title>
  <meta name="description" content="تفاصيل الكورس: الدروس والفيديوهات والاختبارات والانضمام — من منصة الدكتور في العلوم.">
  <link rel="canonical" href="https://www.dr-alsciences.com/course.html">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="courseDetail">

  <!-- الهيدر: مطابق لهيدر courses.html (انسخه كما هو) -->
  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="الدكتور في العلوم">
        <span class="brand-mark"><svg class="icon"><use href="#i-atom"/></svg></span>
        <span class="brand-name">الدكتور <b>في العلوم</b></span>
      </a>
      <nav class="main-nav" id="mainNav" aria-label="التنقل الرئيسي">
        <a href="index.html">الرئيسية</a>
        <a href="stages.html">المراحل الدراسية</a>
        <a href="courses.html" class="is-active" aria-current="page">الكورسات</a>
        <a href="quizzes.html">الاختبارات</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">تواصل معنا</a>
        <div class="nav-auth">
          <a href="login.html" class="btn btn-outline">تسجيل الدخول</a>
          <a href="register.html" class="btn btn-primary">إنشاء حساب</a>
        </div>
      </nav>
      <div class="header-actions">
        <div class="auth-links" id="authLinks">
          <a href="login.html" class="btn btn-ghost btn-sm">تسجيل الدخول</a>
          <a href="register.html" class="btn btn-primary btn-sm">إنشاء حساب</a>
        </div>
        <div class="user-chip" id="userChip" hidden>
          <button id="userChipBtn" class="user-chip-btn" aria-haspopup="true">
            <span class="avatar" id="userInitial">ب</span>
            <span class="user-name" id="userName">حسابي</span>
            <svg class="icon"><use href="#i-chevron-down"/></svg>
          </button>
          <div class="user-menu" id="userMenu" hidden>
            <a href="student-dashboard.html"><svg class="icon"><use href="#i-chart"/></svg> لوحة الطالب</a>
            <a href="profile.html"><svg class="icon"><use href="#i-user"/></svg> ملفي الشخصي</a>
            <button id="logoutBtn" class="danger"><svg class="icon"><use href="#i-logout"/></svg> تسجيل الخروج</button>
          </div>
        </div>
        <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mainNav" aria-label="فتح القائمة">
          <svg class="icon icon-open"><use href="#i-menu"/></svg>
          <svg class="icon icon-close" hidden><use href="#i-close"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="nav-backdrop" id="navBackdrop"></div>

  <main id="main">
    <div class="page-hero">
      <div class="container page-hero-flex">
        <!-- الصورة أو أيقونة بديلة تُحقن هنا من js/courses.js -->
        <div class="hero-fallback" id="heroMedia"><svg class="icon"><use href="#i-cap"/></svg></div>
        <div>
          <nav class="breadcrumb" aria-label="مسار التنقل" id="crumbHere">
            <a href="index.html">الرئيسية</a>
            <span class="sep" aria-hidden="true">/</span>
            <a href="courses.html">الكورسات</a>
          </nav>
          <h1 id="courseTitle">جارٍ تحميل الكورس…</h1>
          <p class="page-desc" id="courseDesc"></p>
          <div class="meta-chips" id="courseChips"></div>
        </div>
      </div>
    </div>

    <div class="container browse-page" id="courseContent">
      <div class="enroll-panel">
        <div class="sk sk-line w40" style="height:22px"></div>
        <div class="sk sk-line w60" style="height:44px"></div>
      </div>
      <section class="grade-section" style="margin-top:26px">
        <div class="sk sk-line w40" style="height:22px;margin-bottom:18px"></div>
        <div class="lesson-list">
          <div class="skeleton-card" style="padding:16px"><div class="sk sk-line w60"></div></div>
          <div class="skeleton-card" style="padding:16px"><div class="sk sk-line"></div></div>
          <div class="skeleton-card" style="padding:16px"><div class="sk sk-line w40"></div></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar container">
      <span>© <span id="year"></span> الدكتور في العلوم — جميع الحقوق محفوظة.</span>
    </div>
  </footer>

  <script type="module" src="js/courses.js"></script>
</body>
</html>
