<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الطالب | الدكتور في العلوم</title>
  <meta name="robots" content="noindex">
  <script>document.documentElement.classList.add('preloading');window.__preloaderStart=Date.now();</script>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="dashboard" data-protected="true">

  <div id="siteHeaderRoot"></div>

  <main class="container dash-page">
    <div class="page-head">
      <h1>مرحبًا، <span id="welcomeName">…</span></h1>
      <p>تابع تقدمك وأكمل ما بدأته — كل درس يقرّبك خطوة من هدفك.</p>
    </div>

    <!-- الإحصائيات -->
    <section class="stat-cards" aria-label="إحصائياتك">
      <div class="stat-card">
        <span class="stat-icon"><svg class="icon"><use href="#i-book"/></svg></span>
        <div><b class="stat-value" id="statLessons">—</b><span class="stat-label">درس مكتمل</span></div>
      </div>
      <div class="stat-card">
        <span class="stat-icon"><svg class="icon"><use href="#i-list-check"/></svg></span>
        <div><b class="stat-value" id="statQuizzes">—</b><span class="stat-label">اختبار تم حلّه</span></div>
      </div>
      <div class="stat-card">
        <span class="stat-icon"><svg class="icon"><use href="#i-award"/></svg></span>
        <div><b class="stat-value" id="statAvg">—</b><span class="stat-label">متوسط النتائج</span></div>
      </div>
      <div class="stat-card">
        <span class="stat-icon"><svg class="icon"><use href="#i-chart"/></svg></span>
        <div><b class="stat-value" id="statProgress">—</b><span class="stat-label">نسبة التقدم الكلية</span></div>
      </div>
    </section>

    <section class="dash-grid">
      <!-- متابعة التعلم -->
      <div class="panel" id="progressPanel">
        <div class="panel-head"><h2>متابعة التعلم</h2></div>
        <div class="sk sk-line w60"></div><div class="sk sk-line"></div><div class="sk sk-line w40"></div>
      </div>
      <!-- الدروس الأخيرة -->
      <div class="panel">
        <div class="panel-head"><h2>الدروس الأخيرة</h2></div>
        <div class="item-list" id="recentLessons">
          <div class="sk sk-line"></div><div class="sk sk-line w60"></div><div class="sk sk-line"></div>
        </div>
      </div>
    </section>

    <!-- آخر النتائج -->
    <section class="panel results-panel">
      <div class="panel-head"><h2>آخر نتائج الاختبارات</h2><a href="results.html">كل النتائج</a></div>
      <div class="item-list" id="recentResults">
        <div class="sk sk-line"></div><div class="sk sk-line w60"></div><div class="sk sk-line"></div>
      </div>
    </section>
  </main>

  <div id="siteFooterRoot"></div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
