<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('preloading');window.__preloaderStart=Date.now();setTimeout(function(){document.documentElement.classList.remove('preloading','preloading-done')},7000);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الطلاب | لوحة الإدارة</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=10">
  <link rel="stylesheet" href="../css/responsive.css?v=10">
</head>
<body data-page="adminStudents">
<div id="adminRoot" hidden>

  <div id="adminTopbarRoot"></div>

  <div class="admin-shell">
    <div id="adminSidebarRoot"></div>

    <main class="admin-main">
      <div class="admin-head">
        <div>
          <h1>الطلاب</h1>
          <p><span id="studentsCount"></span> — ابحث بالاسم أو البريد الإلكتروني.</p>
        </div>
        <div class="admin-head-actions">
          <input type="search" class="form-input search-input" id="studentSearch"
                 placeholder="ابحث بالاسم أو البريد…" aria-label="بحث في الطلاب">
        </div>
      </div>

      <div class="admin-note">
        <svg class="icon"><use href="#i-info"/></svg>
        <span>التعطيل يمنع الطالب من تسجيل الدخول واستخدام المنصة فورًا. حسابات الأدمن محمية من التعطيل.</span>
      </div>

      <div class="table-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>الحساب</th><th>الهاتف</th><th>الصف</th><th>الدور</th>
              <th>التسجيل</th><th>الحالة</th><th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="studentsBody">
            <tr><td colspan="7"><div class="sk sk-line"></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

</div>
<script type="module" src="../js/admin.js"></script>
</body>
</html>
