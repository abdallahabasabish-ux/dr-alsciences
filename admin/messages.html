<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('preloading');window.__preloaderStart=Date.now();setTimeout(function(){document.documentElement.classList.remove('preloading','preloading-done')},7000);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرسائل | لوحة الإدارة</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=10">
  <link rel="stylesheet" href="../css/responsive.css?v=10">
  <style>
    /* أنماط خاصة بصفحة الرسائل */
    .msg-grid{display:grid;gap:14px}
    .msg-card{background:#fff;border:1px solid var(--c-line);border-radius:var(--radius);padding:18px 20px}
    .msg-card.is-replied{border-inline-start:4px solid var(--c-success)}
    .msg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
    .msg-who b{display:block;font-size:1rem}
    .msg-who span{color:var(--c-ink-2);font-size:.85rem}
    .msg-body{white-space:pre-wrap;color:var(--c-ink);margin-top:10px;line-height:1.95;font-size:.97rem}
    .msg-reply{background:var(--c-brand-soft);border-radius:10px;padding:12px 14px;margin-top:12px}
    .msg-reply b{color:var(--c-brand);display:block;margin-bottom:4px;font-size:.88rem}
    .msg-reply p{white-space:pre-wrap;color:var(--c-ink);font-size:.92rem;line-height:1.8}
    .msg-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
    .msg-foot .item-meta{font-size:.8rem}
    @media (max-width:640px){
      .msg-card{padding:14px}
      .msg-foot{flex-direction:column;align-items:stretch}
      .msg-foot .row-actions{justify-content:flex-end}
    }
  </style>
</head>
<body data-page="adminMessages">
<div id="adminRoot" hidden>

  <!-- التوب بار والشريط الجانبي يُولَّدان تلقائيًا من admin-core.js -->
  <div id="adminTopbarRoot"></div>

  <div class="admin-shell">
    <div id="adminSidebarRoot"></div>

    <main class="admin-main">
      <div class="admin-head">
        <div>
          <h1>رسائل التواصل</h1>
          <p><span id="messagesCount"></span> — ابحث بالاسم أو البريد أو نص الرسالة.</p>
        </div>
        <div class="admin-head-actions">
          <input type="search" class="form-input search-input" id="messagesSearch"
                 placeholder="ابحث…" aria-label="بحث في الرسائل">
        </div>
      </div>

      <div class="admin-note">
        <svg class="icon"><use href="#i-info"/></svg>
        <span>الرسائل تصل من صفحة «تواصل معنا». زر «الرد» يحفظ ردك في المنصة، وزر البريد يفتح بريدك بالإجابة جاهزة للإرسال.</span>
      </div>

      <div class="msg-grid" id="messagesList">
        <div class="skeleton-card"><div class="sk-body"><div class="sk sk-line w40"></div><div class="sk sk-line"></div><div class="sk sk-line w60"></div></div></div>
        <div class="skeleton-card"><div class="sk-body"><div class="sk sk-line w40"></div><div class="sk sk-line"></div></div></div>
      </div>
    </main>
  </div>

</div><!-- /adminRoot -->
<script type="module" src="../js/admin-messages.js"></script>
</body>
</html>
