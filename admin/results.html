<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('preloading');window.__preloaderStart=Date.now();setTimeout(function(){document.documentElement.classList.remove('preloading','preloading-done')},7000);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج الطلاب | لوحة الإدارة</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=10">
  <link rel="stylesheet" href="../css/responsive.css?v=10">
</head>
<body data-page="adminResults">
<div id="adminRoot" hidden>

  <div id="adminTopbarRoot"></div>

  <div class="admin-shell">
    <div id="adminSidebarRoot"></div>

    <main class="admin-main">
      <div class="admin-head">
        <div>
          <h1>نتائج الطلاب</h1>
          <p><span id="resultsCount"></span> — ابحث باسم الطالب أو بريده أو عنوان الاختبار.</p>
        </div>
        <div class="admin-head-actions">
          <input type="search" class="form-input search-input" id="resultsSearch"
                 placeholder="ابحث…" aria-label="بحث في النتائج">
        </div>
      </div>

      <div class="admin-note">
        <svg class="icon"><use href="#i-info"/></svg>
        <span>النتائج للقراءة فقط — لا يمكن تعديل درجات الطلاب أو حذفها حفاظًا على المصداقية (مفروض من قواعد Firestore).</span>
      </div>

      <div class="table-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>الطالب</th><th>الاختبار</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <tr><td colspan="5"><div class="sk sk-line"></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

</div>
<script type="module" src="../js/admin-content.js"></script>
</body>
</html>
