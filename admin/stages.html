<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('preloading');window.__preloaderStart=Date.now();setTimeout(function(){document.documentElement.classList.remove('preloading','preloading-done')},7000);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المراحل والصفوف | لوحة الإدارة</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=10">
  <link rel="stylesheet" href="../css/responsive.css?v=10">
</head>
<body data-page="adminStages">
<div id="adminRoot" hidden>

  <div id="adminTopbarRoot"></div>

  <div class="admin-shell">
    <div id="adminSidebarRoot"></div>

    <main class="admin-main" id="stagesSection">
      <div class="admin-head">
        <div>
          <h1>المراحل والصفوف</h1>
          <p>الأسماء تظهر للطلاب كما تُدخلها هنا — لا أسماء ثابتة في الكود.</p>
        </div>
        <div class="admin-head-actions">
          <button class="btn btn-outline" id="addStageBtn">
            <svg class="icon"><use href="#i-plus"/></svg> إضافة مرحلة</button>
          <button class="btn btn-primary" id="addGradeBtn">
            <svg class="icon"><use href="#i-plus"/></svg> إضافة صف</button>
        </div>
      </div>

      <section style="margin-bottom:36px">
        <h2 style="font-size:1.1rem;margin-bottom:14px">المراحل الدراسية</h2>
        <div class="table-card">
          <table class="admin-table">
            <thead><tr><th>المرحلة</th><th>الترتيب</th><th>الحالة</th><th>إجراءات</th></tr></thead>
            <tbody id="stagesBody">
              <tr><td colspan="4"><div class="sk sk-line"></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section>
        <div class="admin-head" style="margin-bottom:14px">
          <h2 style="font-size:1.1rem">الصفوف الدراسية</h2>
          <select class="form-select" id="stageFilter" style="max-width:220px">
            <option value="">كل المراحل</option>
          </select>
        </div>
        <div class="table-card">
          <table class="admin-table">
            <thead><tr><th>الصف</th><th>المرحلة</th><th>الترتيب</th><th>الحالة</th><th>إجراءات</th></tr></thead>
            <tbody id="gradesBody">
              <tr><td colspan="5"><div class="sk sk-line"></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

</div>
<script type="module" src="../js/admin.js"></script>
</body>
</html>
