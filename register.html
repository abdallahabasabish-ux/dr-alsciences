<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | الدكتور في العلوم</title>
  <meta name="description" content="أنشئ حسابك المجاني في منصة الدكتور في العلوم وابدأ التعلم اليوم.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="الدكتور في العلوم — الصفحة الرئيسية">
        <span class="brand-mark"><svg class="icon"><use href="#i-atom"/></svg></span>
        <span class="brand-name">الدكتور <b>في العلوم</b></span>
      </a>
      <a href="index.html" class="btn btn-ghost btn-sm" style="margin-inline-start:auto">العودة للرئيسية</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-head">
        <span class="auth-mark"><svg class="icon"><use href="#i-atom"/></svg></span>
        <h1>إنشاء حساب مجاني</h1>
        <p>دقيقة واحدة تفصلك عن أول درس</p>
      </div>

      <div class="form-banner info" id="formBanner" hidden>
        <svg class="icon"><use href="#i-info"/></svg>
        <span></span>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">الاسم الكامل</label>
          <input class="form-input" type="text" id="name" name="name" autocomplete="name" placeholder="مثال: أحمد محمد">
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">رقم الهاتف</label>
          <input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel" dir="ltr" inputmode="tel" placeholder="+20 100 000 0000">
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">البريد الإلكتروني</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="email" dir="ltr" placeholder="name@example.com">
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="grade">صفك الدراسي <span class="optional">(اختياري)</span></label>
          <select class="form-select" id="grade" name="grade">
            <option value="">اختر صفك لتتبع تقدمك بدقة</option>
          </select>
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" dir="ltr" placeholder="6 أحرف على الأقل">
            <button type="button" class="input-toggle" id="togglePassword" aria-label="إظهار كلمة المرور">
              <svg class="icon"><use href="#i-eye"/></svg>
            </button>
          </div>
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">تأكيد كلمة المرور</label>
          <input class="form-input" type="password" id="confirm" name="confirm" autocomplete="new-password" dir="ltr" placeholder="••••••••">
          <p class="form-error"></p>
        </div>
        <button class="btn btn-primary btn-lg btn-block" id="registerBtn" type="submit">إنشاء الحساب</button>
      </form>

      <p class="auth-alt">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
    </div>
  </main>

  <footer class="site-footer footer-minimal">
    <div class="footer-bar container">
      <span>© <span id="year"></span> الدكتور في العلوم — جميع الحقوق محفوظة.</span>
    </div>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
