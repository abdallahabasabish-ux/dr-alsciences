<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | الدكتور في العلوم</title>
  <meta name="description" content="أنشئ حسابك المجاني في منصة الدكتور في العلوم وابدأ التعلم اليوم.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">

  <div class="auth-split">
    <aside class="auth-side">
      <img class="side-logo" src="assets/icons/logo.svg" alt="شعار الدكتور في العلوم">
      <h2>الدكتور <b>في العلوم</b></h2>
      <p>دقيقة واحدة تفصلك عن أول درس — أنشئ حسابك وابدأ رحلتك في العلوم اليوم.</p>
      <ul class="auth-points">
        <li><svg class="icon"><use href="#i-check"/></svg> حساب مجاني بالكامل</li>
        <li><svg class="icon"><use href="#i-check"/></svg> حفظ دروسك المكتملة ونتائجك</li>
        <li><svg class="icon"><use href="#i-check"/></svg> محتوى يناسب صفك الدراسي</li>
      </ul>
      <span class="auth-side-footer">© <span id="sideYear"></span> الدكتور في العلوم</span>
    </aside>

    <main class="auth-panel">
      <div class="auth-card">
        <div class="auth-top">
          <img src="assets/icons/logo.svg" alt="شعار الدكتور في العلوم" style="width:46px;height:46px;object-fit:contain">
          <a href="index.html" class="btn btn-ghost btn-sm">العودة للرئيسية</a>
        </div>
        <div class="auth-head" style="text-align:start;margin-bottom:22px">
          <h1 style="font-size:1.5rem">إنشاء حساب مجاني</h1>
          <p style="color:var(--c-ink-2);font-size:.95rem;margin-top:6px">أدخل بياناتك للانضمام إلى المنصة</p>
        </div>

        <div class="form-banner info" id="formBanner" hidden>
          <svg class="icon"><use href="#i-info"/></svg><span></span>
        </div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">الاسم الكامل <span class="req">*</span></label>
            <input class="form-input" type="text" id="name" name="name" autocomplete="name" placeholder="مثال: أحمد محمد">
            <p class="form-error"></p>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="country">كود الدولة <span class="req">*</span></label>
              <select class="form-select" id="country" name="country"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="phone">رقم الهاتف <span class="req">*</span></label>
              <input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel" dir="ltr" inputmode="tel" placeholder="1XX XXX XXXX">
              <p class="form-error"></p>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="governorate">المحافظة <span class="req">*</span></label>
              <select class="form-select" id="governorate" name="governorate"></select>
              <input class="form-input" type="text" id="governorateText" name="governorateText" placeholder="اكتب المحافظة" hidden>
              <p class="form-error"></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="city">المدينة <span class="optional">(اختياري)</span></label>
              <input class="form-input" type="text" id="city" name="city" placeholder="مثال: نصر">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">البريد الإلكتروني <span class="req">*</span></label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" dir="ltr" placeholder="name@example.com">
            <p class="form-error"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="grade">صفك الدراسي <span class="optional">(اختياري)</span></label>
            <select class="form-select" id="grade" name="grade">
              <option value="">اختر صفك لتتبع تقدمك بدقة</option>
            </select>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="password">كلمة المرور <span class="req">*</span></label>
              <div class="input-wrap">
                <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" dir="ltr" placeholder="6 أحرف على الأقل">
                <button type="button" class="input-toggle" id="togglePassword" aria-label="إظهار كلمة المرور">
                  <svg class="icon"><use href="#i-eye"/></svg>
                </button>
              </div>
              <p class="form-error"></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="confirm">تأكيد كلمة المرور <span class="req">*</span></label>
              <input class="form-input" type="password" id="confirm" name="confirm" autocomplete="new-password" dir="ltr" placeholder="••••••••">
              <p class="form-error"></p>
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" id="registerBtn" type="submit">إنشاء الحساب</button>
        </form>

        <p class="auth-alt">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
      </div>
    </main>
  </div>

  <script>document.getElementById('sideYear').textContent = new Date().getFullYear();</script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
