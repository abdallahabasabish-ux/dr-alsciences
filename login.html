<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | الدكتور في العلوم</title>
  <meta name="description" content="سجّل الدخول إلى منصة الدكتور في العلوم لمتابعة دروسك واختباراتك وتقدمك التعليمي.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="الدكتور في العلوم — الصفحة الرئيسية">
        <span class="brand-mark"><svg class="icon"><use href="#i-atom"/></svg></span>
        <span class="brand-name">الدكتور <b>في العلوم</b></span>
      </a>
      <a href="index.html" class="btn btn-ghost btn-sm" style="margin-inline-start:auto">العودة للرئيسية</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-head">
        <span class="auth-mark"><svg class="icon"><use href="#i-atom"/></svg></span>
        <h1>تسجيل الدخول</h1>
        <p>أكمل رحلتك التعليمية من حيث توقفت</p>
      </div>

      <div class="form-banner info" id="formBanner" hidden>
        <svg class="icon"><use href="#i-info"/></svg>
        <span></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">البريد الإلكتروني</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="email" dir="ltr" placeholder="name@example.com">
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" dir="ltr" placeholder="••••••••">
            <button type="button" class="input-toggle" id="togglePassword" aria-label="إظهار كلمة المرور">
              <svg class="icon"><use href="#i-eye"/></svg>
            </button>
          </div>
          <p class="form-error"></p>
        </div>
        <button class="btn btn-primary btn-lg btn-block" id="loginBtn" type="submit">تسجيل الدخول</button>
      </form>

      <p class="auth-alt">ليس لديك حساب؟ <a href="register.html">أنشئ حسابًا مجانيًا</a></p>
    </div>
  </main>

  <footer class="site-footer footer-minimal">
    <div class="footer-bar container">
      <span>© <span id="year"></span> الدكتور في العلوم — جميع الحقوق محفوظة.</span>
    </div>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
