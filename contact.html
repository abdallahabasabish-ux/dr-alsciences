<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('preloading');window.__preloaderStart=Date.now();setTimeout(function(){document.documentElement.classList.remove('preloading','preloading-done')},7000);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا | الدكتور في العلوم</title>
  <meta name="description" content="تواصل مع فريق منصة الدكتور في العلوم — استفسارات ومقترحات ودعم فني، ونرد عليك في أسرع وقت.">
  <link rel="canonical" href="https://www.dr-alsciences.com/contact.html">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="contact">

  <div id="siteHeaderRoot"></div>

  <main id="main">
    <div class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="مسار التنقل">
          <a href="index.html">الرئيسية</a>
          <span class="sep" aria-hidden="true">/</span>
          <span aria-current="page">تواصل معنا</span>
        </nav>
        <h1>تواصل معنا</h1>
        <p class="page-desc">لديك سؤال أو اقتراح؟ اكتب لنا وسنرد عليك في أسرع وقت.</p>
      </div>
    </div>

    <div class="container browse-page">
      <div class="contact-grid">
        <!-- بيانات التواصل — عدّلها ببياناتك الحقيقية -->
        <aside class="panel">
          <h2 style="font-size:1.05rem;margin-bottom:14px">معلومات التواصل</h2>
          <div class="item-list">
            <div class="item-row">
              <span class="item-icon"><svg class="icon"><use href="#i-mail"/></svg></span>
              <span class="item-text"><b>البريد الإلكتروني</b><span class="item-meta" dir="ltr">support@example.com</span></span>
            </div>
            <div class="item-row">
              <span class="item-icon"><svg class="icon"><use href="#i-phone"/></svg></span>
              <span class="item-text"><b>الهاتف / واتساب</b><span class="item-meta" dir="ltr">+20 100 000 0000</span></span>
            </div>
            <div class="item-row">
              <span class="item-icon"><svg class="icon"><use href="#i-clock"/></svg></span>
              <span class="item-text"><b>أوقات الرد</b><span class="item-meta">يوميًا من 10 صباحًا حتى 6 مساءً</span></span>
            </div>
          </div>
        </aside>

        <form class="panel" id="contactForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">الاسم <span class="req">*</span></label>
            <input class="form-input" type="text" id="name" name="name" autocomplete="name" required>
            <p class="form-error"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">البريد الإلكتروني <span class="req">*</span></label>
            <input class="form-input" type="email" id="email" name="email" dir="ltr" autocomplete="email" required>
            <p class="form-error"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">رقم الهاتف <span class="optional">(اختياري)</span></label>
            <input class="form-input" type="tel" id="phone" name="phone" dir="ltr" inputmode="tel">
          </div>
          <div class="form-group">
            <label class="form-label" for="message">رسالتك <span class="req">*</span></label>
            <textarea class="form-textarea" id="message" name="message" rows="6" required
              placeholder="اكتب استفسارك أو اقتراحك… (10 أحرف على الأقل)"></textarea>
            <p class="form-error"></p>
          </div>
          <button class="btn btn-primary btn-lg" id="sendBtn" type="submit">إرسال الرسالة</button>
        </form>
      </div>
    </div>
  </main>

  <div id="siteFooterRoot"></div>

  <script type="module" src="js/contact.js"></script>
</body>
</html>
