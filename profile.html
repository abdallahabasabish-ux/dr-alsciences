<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي | الدكتور في العلوم</title>
  <meta name="robots" content="noindex">
  <script>document.documentElement.classList.add('preloading');window.__preloaderStart=Date.now();</script>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="profile" data-protected="true">

  <div id="siteHeaderRoot"></div>

  <main class="container dash-page">
    <div class="page-head">
      <h1>الملف الشخصي</h1>
      <p>شاهد وعدّل بياناتك وصورتك الشخصية.</p>
    </div>

    <div class="profile-grid">
      <aside class="panel profile-summary">
        <div class="avatar-edit">
          <img class="avatar-lg" id="avatarImg" alt="صورتك الشخصية" hidden>
          <span class="avatar avatar-lg" id="profileInitial">…</span>
          <button type="button" class="avatar-cam" id="avatarBtn" title="تغيير الصورة" aria-label="تغيير الصورة">
            <svg class="icon"><use href="#i-pen"/></svg>
          </button>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>
        <b id="profileName">…</b>
        <span id="profileEmail" dir="ltr" class="item-meta"></span>
        <span class="item-meta" id="profileLocation"></span>
        <span class="item-meta" id="profileSince"></span>
      </aside>

      <form class="panel" id="profileForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">الاسم الكامل</label>
          <input class="form-input" type="text" id="name" name="name" autocomplete="name">
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="country">كود الدولة</label>
            <select class="form-select" id="country" name="country"></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">رقم الهاتف</label>
            <input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel" dir="ltr" inputmode="tel">
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="governorate">المحافظة</label>
            <select class="form-select" id="governorate" name="governorate"></select>
            <input class="form-input" type="text" id="governorateText" placeholder="اكتب المحافظة" hidden>
          </div>
          <div class="form-group">
            <label class="form-label" for="city">المدينة</label>
            <input class="form-input" type="text" id="city" name="city">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="grade">الصف الدراسي</label>
          <select class="form-select" id="grade" name="grade">
            <option value="">— بدون صف محدد —</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="emailField">البريد الإلكتروني</label>
          <input class="form-input" type="email" id="emailField" disabled dir="ltr">
          <p class="form-hint">لا يمكن تغيير البريد الإلكتروني حاليًا.</p>
        </div>
        <button class="btn btn-primary" id="saveBtn" type="submit">
          <svg class="icon"><use href="#i-pen"/></svg> حفظ التغييرات
        </button>
      </form>
    </div>
  </main>

  <div id="siteFooterRoot"></div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
